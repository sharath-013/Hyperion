<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | HYPERION</title>
    <link rel="stylesheet" href="Signup.css">
</head>
<body>
    <div class="signin-container">
        <div class="signin-header">
            <h1>Sign In</h1>
            <p>Access your account</p>
        </div>
        <form action="#" method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="inf" placeholder="name@example.com">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="inf" placeholder="********">
            <button type="submit" class="btn-submit">Login</button>
            <p id="message" class="message"></p>
            <p class="links">
                <a href="#">Forgot Password?</a> 
                <a href="#">Sign Up</a>
            </p>
        </form>
    </div>
        <script>
        document.querySelector('form').addEventListener('submit', function(r) {
            r.preventDefault();

            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            const m = document.getElementById('message');
            
            if (e && p) {
                m.textContent = 'Login successful!';
                m.className = 'message success';
            } else {
                m.textContent = 'Please enter email and password.';
                m.className = 'message error';
            }
        });
        </script>
</body>
</html>
